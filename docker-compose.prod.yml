# SEYAL-TCHAD ERP - overlay de production (section 19 : HTTPS devant Odoo).
#
# Usage (voir README pour la procedure complete, notamment le bootstrap
# du tout premier certificat) :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Ne remplace pas docker-compose.yml : s'utilise TOUJOURS en plus de lui
# (les deux services "db" et "odoo" de base restent inchanges, aucune
# regression sur l'environnement de developpement existant).
services:
  odoo:
    # Mot de passe maitre (protege /web/database/manager), fourni via
    # .env et jamais en dur dans le code. Odoo n'accepte
    # admin_passwd que dans le fichier de config, pas en option CLI : le
    # conteneur copie odoo.prod.conf vers un fichier inscriptible au
    # demarrage, y ajoute cette ligne a partir de la variable
    # d'environnement, puis lance Odoo avec ce fichier complete.
    environment:
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD}
    volumes:
      - ./odoo.prod.conf:/etc/odoo/odoo.prod.conf:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cp /etc/odoo/odoo.prod.conf /tmp/odoo.conf
        echo "admin_passwd = $${ODOO_ADMIN_PASSWORD}" >> /tmp/odoo.conf
        export ODOO_RC=/tmp/odoo.conf
        exec /entrypoint.sh odoo
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    depends_on:
      - odoo
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    restart: unless-stopped

  # Renouvellement automatique du certificat (verifie/renouvelle deux
  # fois par jour ; Let's Encrypt ne renouvelle en pratique qu'a partir
  # de 30 jours avant expiration). Le tout premier certificat doit etre
  # obtenu manuellement avant de demarrer nginx - voir README.
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done;"

volumes:
  certbot_www:
  certbot_certs:
