name: SEYAL-TCHAD ERP tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  SEYAL_MODULES: >-
    seyal_base,seyal_security,seyal_product,seyal_partner,seyal_purchase,seyal_stock,seyal_sale,seyal_delivery,seyal_finance,seyal_fleet,seyal_commercial,seyal_hr,seyal_reporting,seyal_dashboard

jobs:
  seyal-odoo-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env (identifiants CI ephemeres - jamais utilises hors de ce job)
        run: |
          cat > .env <<'EOF'
          DB_USER=odoo
          DB_PASSWORD=ci_only_password
          ODOO_ADMIN_PASSWORD=ci_only_admin_password
          EOF

      - name: Start PostgreSQL
        run: docker compose up -d db

      - name: Install all SEYAL-TCHAD modules and run their test suites
        run: |
          MODULES="$(echo "$SEYAL_MODULES" | tr -d ' \n')"
          TAGS="/$(echo "$MODULES" | sed 's/,/,\//g')"
          docker compose run --rm odoo odoo \
            --test-enable \
            --stop-after-init \
            --test-tags "$TAGS" \
            -i "$MODULES" \
            -d ci_test_seyal \
            --db_host db --db_user "$DB_USER_FROM_ENV" --db_password "$DB_PASSWORD_FROM_ENV" \
            --logfile=/dev/stdout
        env:
          DB_USER_FROM_ENV: odoo
          DB_PASSWORD_FROM_ENV: ci_only_password

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=500 odoo db

      - name: Tear down
        if: always()
        run: docker compose down -v
