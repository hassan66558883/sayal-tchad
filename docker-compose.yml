services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: seyal_dev
      POSTGRES_USER: ${DB_USER:-seyal}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - seyal_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  seyal_db_data:
