[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
logfile = /var/log/odoo/odoo.log
log_level = info
without_demo = all

; Difference avec odoo.conf (dev) - durcissement pour la production
 :
;
; proxy_mode : fait confiance aux en-tetes X-Forwarded-* envoyes par le
; reverse proxy nginx (docker-compose.prod.yml). Indispensable derriere un
; reverse proxy : sans ca, Odoo genere des URLs en http:// au lieu de
; https://, les cookies de session ne sont pas marques "secure", et
; l'adresse IP journalisee pour chaque requete est celle du conteneur
; nginx plutot que celle du client reel.
proxy_mode = True

; list_db = False : masque le selecteur de bases de donnees et la page
; /web/database/manager en HTTP. Recommandation standard Odoo pour la
; production (evite d'exposer publiquement la liste des bases et les
; actions de creation/suppression de base). Le mot de passe maitre
; (--admin_passwd, fourni via ODOO_ADMIN_PASSWORD dans .env)
; reste la protection de dernier recours si cette page est quand meme
; appelee directement. N'empeche PAS la connexion normale des
; utilisateurs via /web/login?db=<nom>.
list_db = False

; db_filter : A DEFINIR avant la mise en production des qu'il y a plus
; d'une base sur le serveur Postgres. Sans ca, Odoo ne peut pas
; determiner seul quelle base servir (meme avec list_db=False) et la
; page de connexion redirige en boucle. Exemple pour une seule base
; nommee "seyal_prod" :
; db_filter = ^seyal_prod$
